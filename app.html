:root{--bg:#05070b;--bg2:#0b0f16;--card:#101623;--paper:#f0ebe2;--p2:#c9c3b8;--p3:#9d968a;--p4:#6d675d;

 --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,'Segoe UI',Roboto,sans-serif;

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--paper);font-family:var(--sans);overflow:hidden}

main{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}

.leaflet-container{background:#0a0e14;font-family:var(--sans)}
.leaflet-control-attribution{background:rgba(5,7,11,.6)!important;color:#666!important;font-size:9px!important}
.leaflet-control-attribution a{color:#888!important}

nav{display:flex;background:rgba(8,11,17,.97);border-top:1px solid rgba(201,162,39,.16);
 padding-bottom:var(--sab);z-index:50}
nav button{flex:1;background:none;border:0;color:var(--p4);font-family:var(--sans);
 font-size:10px;font-weight:700;letter-spacing:.06em;padding:9px 0 7px;cursor:pointer}
nav button i{display:block;font-size:21px;font-style:normal;margin-bottom:3px;opacity:.8}
nav button.on{color:var(--bronze)}
nav button.on i{opacity:1}
/* шапка */
header{padding:calc(var(--sat) + 10px) 16px 8px;display:flex;align-items:baseline;gap:10px;
 background:linear-gradient(180deg,rgba(5,7,11,.95),rgba(5,7,11,.7));z-index:40;position:relative}
header b{font-family:var(--serif);font-size:19px;font-weight:700}
header b em{color:var(--accent);font-style:italic}
header span{font-size:11px;color:var(--p4)}
/* чипы фильтров */
#chips{position:absolute;top:calc(var(--sat) + 52px);left:0;right:0;z-index:41;display:flex;gap:8px;
 padding:8px 14px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(201,162,39,.35);border-radius:999px;background:rgba(8,11,17,.88);
 color:var(--p2);font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--bronze);color:#0a0a08;border-color:var(--bronze)}
/* маркеры */
.pin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--bronze);
 background:rgba(9,12,18,.72);display:grid;place-items:center;box-shadow:0 0 14px rgba(201,162,39,.35)}
.pin i{width:9px;height:9px;border-radius:50%;background:var(--bronze);font-style:normal}
.pin.cut{border-color:var(--wine)}.pin.cut i{background:var(--wine)}
.pin.fin{border-color:var(--sea)}.pin.fin i{background:var(--sea)}
.pin.done::after{content:'✓';position:absolute;top:-7px;right:-7px;width:15px;height:15px;font-size:10px;
 background:var(--bronze);color:#0a0a08;border-radius:50%;display:grid;place-items:center;font-weight:800}
.pin.alt{width:18px;height:18px;border-style:dashed;border-width:1.5px;opacity:.85}
.pin.alt i{width:5px;height:5px}
/* шит локации */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;background:var(--bg2);
 border-radius:18px 18px 0 0;border-top:1px solid rgba(201,162,39,.25);
 max-height:76%;overflow-y:auto;transform:translateY(105%);transition:transform .28s ease;
 padding:14px 18px calc(var(--sab) + 18px)}
#sheet.on{transform:none}
#sheet .grab{width:44px;height:4px;border-radius:2px;background:rgba(240,235,226,.2);margin:0 auto 12px}
#sheet .role{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}
#sheet h2{font-family:var(--serif);font-size:26px;margin:4px 0 2px}
#sheet .song{font-size:12px;color:var(--bronze);margin-bottom:8px}
#sheet .place{font-size:13px;color:var(--p3);line-height:1.5;margin-bottom:12px}
#sheet .place b{color:var(--p2)}
.seg{display:flex;gap:6px;margin:10px 0}

#sbody .who{font-size:11px;color:var(--p4);margin-top:8px}
.srow{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.btn.gold{background:var(--bronze);color:#0a0a08}
.btn.line{background:none;border:1px solid rgba(201,162,39,.4);color:var(--bronze)}
.btn.gold:disabled{opacity:.55}
/* главы */
.wrap{padding:calc(var(--sat) + 60px) 16px calc(var(--sab) + 20px);max-width:640px;margin:0 auto}
.chap{border:1px solid rgba(201,162,39,.18);border-radius:14px;background:var(--card);margin-bottom:10px;overflow:hidden}
.chap>button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--paper);
 padding:14px 16px;cursor:pointer;text-align:left}
.chap .rom{font-family:var(--serif);font-size:19px;color:var(--bronze);width:38px;font-weight:700}
.chap .ct{flex:1;font-size:15.5px;font-weight:600;font-family:var(--serif)}
.chap .st{font-size:11px;color:var(--p4)}
.chap .body{display:none;padding:2px 18px 16px;font-size:14.5px;line-height:1.66;color:var(--p2)}
.chap.open .body{display:block}
.chap .body p{margin-bottom:12px}
.chap .body a{color:var(--bronze)}
.readbtn{margin-top:6px;font-size:12.5px}
/* кино */
.vidcard{border-radius:14px;overflow:hidden;border:1px solid rgba(201,162,39,.2);margin-bottom:14px;background:var(--card)}
.vidcard video{width:100%;display:block;background:#000}
.vidcard .cap{padding:10px 14px;font-size:13px;color:var(--p3)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.fact{border:1px solid rgba(201,162,39,.18);border-radius:12px;padding:14px;background:var(--card)}
.fact b{display:block;font-family:var(--serif);font-size:24px;color:var(--bronze)}
.fact span{font-size:11.5px;color:var(--p4);line-height:1.4;display:block;margin-top:3px}

.ach{aspect-ratio:1;border-radius:12px;border:1px solid rgba(201,162,39,.18);background:var(--card);

.ach.got{opacity:1;border-color:var(--bronze);box-shadow:0 0 16px rgba(201,162,39,.15)}
.ach i{font-size:22px;font-style:normal}
.ach span{font-size:9.5px;color:var(--p3);line-height:1.25;display:block;margin-top:4px}
#pbar{height:6px;border-radius:3px;background:rgba(240,235,226,.1);overflow:hidden;margin:10px 0 4px}
#pbar i{display:block;height:100%;background:var(--bronze);width:0;transition:width .5s}

 border:0;color:var(--paper);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
#cinCap{font-family:var(--serif);font-size:17px;text-align:center;color:var(--paper);margin-top:14px;

 flex-direction:column;justify-content:center;padding:28px;text-align:center}

#onb h1{font-family:var(--serif);font-size:30px;margin-bottom:6px}

#onb .ico{font-size:44px;margin-bottom:8px}

#onb .dots{display:flex;gap:7px;justify-content:center;margin-top:18px}
#onb .dots i{width:7px;height:7px;border-radius:50%;background:rgba(240,235,226,.2);font-style:normal}

 padding:10px 16px;display:flex;gap:10px;align-items:center;transition:transform .3s;max-width:88vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast .tt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze);font-weight:800}
#toast .tn{font-size:13.5px;font-weight:600}
.note{font-size:12px;color:var(--p4);line-height:1.5;margin-top:14px}
h3.sec{font-family:var(--serif);font-size:21px;margin:18px 0 10px}

   "«Одиссея» стоит у самых истоков европейской литературы. И начинается она так: «Мужа мне, Муза, поведай…». Но пятое слово в этой первой строке до сих пор ставит переводчиков в тупик.",
   "Слово это — πολύτροπος, буквально «много-поворотный». И непонятно главное: кто тут поворачивает. Если Одиссей сам — он хитрец и ловкач, тот, кто под любого подстроится. А если поворачивают его — он бедолага, которого мотало по свету двадцать лет. От того, как прочесть одно слово, зависит, кто перед нами: человек, который всё подстроил сам, — или человек, с которым всё случилось.",

   "У греков не было международного права. Был обычай крепче любого права — и его нарушение считалось не грубостью, а святотатством.",

   "Обмен подарками в архаических обществах — не проявление щедрости, а система из трёх обязанностей: давать, принимать, возмещать. Отказ в любой из трёх точек равен объявлению вражды. Мосс писал не о греках, а о полинезийцах и индейцах северо-западного побережья, — и именно поэтому его вывод так важен: ксения не греческая экзотика, а частный случай механизма, который антропологи находят по всему миру.",

   "Ниже — все двадцать четыре шага, от «гость ждёт у порога» до «хозяин даёт провожатых». Нажимайте на имена над сеткой: у каждого хозяина — феаков, Эвмея, Цирцеи, Полифема, женихов — видно, какие шаги он выполнил, какие пропустил, а какие вывернул наизнанку. Последняя кнопка — сам фильм, прогнанный по той же сетке.",
   "Обратите внимание на тринадцатый шаг. У феаков имя спрашивают в восьмой песни — гость к тому времени уже вымыт, одет, накормлен и час как сидит за столом. У Полифема имя спрашивают первым, до всего. Один и тот же вопрос, заданный в разное время, — это разница между цивилизацией и людоедством. Ничего больше в тексте про это не сказано, и ничего больше не нужно.",
   "И ещё: единственный, кто выполняет протокол целиком, ничего не пропустив, — свинопас Эвмей, самый бедный человек в поэме. У него нет ни дворца, ни даров, ни корабля с провожатыми. Он режет собственного поросёнка. Гомер тратит на его хижину больше строк, чем на дворец феаков.",
   "Эмили Уилсон, переводчица «Одиссеи», считает, что фильм подменил ксению — и подменил именно в этом месте.",
   "Её первая претензия: в фильме закон Зевса «пропущен через современные американские представления о важности филантропической благотворительности» — состоятельные должны быть милостивы к бедным вокруг, не делая при этом ничего, чтобы бедности стало меньше. Ксения, говорит она, была не благотворительностью, а договором между равными, с обменом дарами и обязательствами в обе стороны.",
   "Её вторая претензия тяжелее. Она собирает пары и показывает непоследовательность: убивать хитростью плохо, когда греки убивают троянцев, и хорошо, когда Одиссей убивает женихов; взять брошенное естественно, когда троянцы забирают коня, и непростительно, когда женихи претендуют на дворец. И одной строкой: «Закон Зевса подан как критически важный — а Зевса нет».",
   "А в The Atlantic — удар, от которого труднее всего уйти: фильм «не объясняет, при чём тут гостеприимство» там, где греки осаждают Трою уже десять лет. Нельзя нарушить закон гостеприимства по отношению к тем, с кем ты десять лет воюешь.",
   "Тео Нэш в Slate переворачивает обвинение: то, что Уилсон, по его мнению, прочла невнимательнее всего, — как раз ядро фильма. Конь у Нолана не «военная хитрость против врага». Это дар. Предмет, оставленный на берегу с надписью-посвящением и с людьми внутри. Осада — война; подделанный дар — уже не война, а нарушение той единственной рамки, которая держалась и во время войны тоже. Дальше — вывод, который напрашивается сам: троянцы вносят коня в город, потому что дар нельзя не принять.",
   "Проверить это можно той же сеткой шагов. Примерьте её к коню: шаг двадцатый — «гостю дают дар», шаг двадцать первый — «дар запоминают по имени дарителя». Оба выполнены. Оба вывернуты наизнанку.",
   "Мы не считаем этот ответ окончательным. Вторая претензия Уилсон — про непоследовательность — остаётся сильной, и мы вернёмся к ней в главе о сиренах, где голоса спорящих идут подряд и где считать очки будете вы."

   "Начнём с того, что почти все помнят неправильно. У Гомера сирены не полуптицы и не полурыбы: как они выглядят, не сказано ни слова. Хвост им приделало Средневековье. Их двое, а не сонм. И соблазняют они не телом — про тело в эпизоде нет ничего вовсе.",
   "Они обращаются к проплывающему кораблю формулой из «Илиады», которая больше нигде в «Одиссее» не встречается, — «многославный Одиссей, великая слава ахейцев», — и предлагают одно: остановиться и послушать песню о нём самом. Мы знаем, говорят они, всё, что претерпели в широкой Трое аргивяне и троянцы. Кто нас услышит, уйдёт, насладившись и зная больше.",

   "«Илиада» и «Одиссея» — поэмы о том, как кончается век героев. Нолан снял то же самое про наш век. И один раз уже снимал.",
   "Греки знали, что живут после конца. У Гесиода, современника Гомера, история человечества разложена на пять родов, и каждый следующий хуже предыдущего — кроме одного.",

   "Отсюда следует вещь, которую редко проговаривают. «Илиада» и «Одиссея» — не поэмы о славе. Это поэмы о её конце. Гомер поёт не о том, как хорошо быть героем, а о том, как последние герои уничтожают друг друга и закрывают за собой дверь. «Одиссея» вообще целиком про то, что делает выживший, когда возвращаться уже некуда: мир, из которого он уходил, кончился, пока его не было.",
   "И это не поэтическая фигура. За гомеровскими руинами стоит настоящая катастрофа: около 1200 года до нашей эры Восточное Средиземноморье действительно рухнуло. За пару поколений исчезли микенские дворцы, Хеттское царство, торговые сети, а вместе с ними — письменность: греки разучились писать примерно на четыре столетия. Поэму, которую мы читаем, сложили уже потом, по памяти о памяти.",

   "Он же снимает главную претензию к фильму одной фразой: требовать историчности от Гомера бессмысленно, потому что в эпосе смешаны реалии микенской и архаической Греции, между которыми полтысячи лет. Оценка фильма — восемь из десяти.",
   "Эрик Клайнархеолог, Университет Джорджа Вашингтона, «1177 год до н. э.: год, когда рухнула цивилизация»",
   "Спорит с идеей одной причины. Крах бронзового века он объясняет как идеальный шторм из бедствий: засухи, землетрясения, обрыв торговых путей, восстания, переселения — по отдельности переживаемые, вместе смертельные. Рушилось не государство, а связность: система была слишком переплетена, чтобы уцелеть по частям.",
   "Рецензенты замечают, что строгого определения «краха» Клайн так и не даёт, и спор об этом продолжается. Но образ взаимосвязанного мира, который ломается не в одной точке, а везде сразу, из археологии перекочевал в популярную культуру — и в этот фильм.",
   "«Эта мысль о цикле, о цивилизации в сумерках, — она есть и в прошлом, только неявно».",
   "Режиссёр говорит об этом сам и почти теми же словами: он снимал цивилизацию в сумерках — и делает это второй раз подряд. «Оппенгеймер» и «Одиссея» — не два разных фильма, а один разговор, разложенный на две половины. Приквел и продолжение одновременно, в зависимости от того, с какой стороны смотреть.",
   "Ниже — то, что в «Оппенгеймере» показано полторы минуты и без единого слова. Взгляд сверху, с высоты нескольких километров: так видно не только вспышку, но и то, что она делает с равниной. Прокручивайте страницу — время идёт вместе с вами, а по ходу подписаны детали, которые обычно проскакивают мимо."
  ]
 },
 {
  "id": "s-myth",
  "rom": "XI",
  "title": "Вневременное",
  "anchor": "#s-myth",
  "paras": [
   "Упрекать эту поэму в неисторичности — примерно как упрекать сон в неточности. Она с самого начала собрана из времени, которого не существовало.",
   "Самое частое обвинение в адрес фильма звучит так: у Нолана всё было не так, как на самом деле. Загвоздка в том, что «на самом деле» не было и у Гомера.",
   "Поэму сложили примерно в восьмом веке до нашей эры — о событиях, которые её собственная традиция относила лет на пятьсот назад. Внутри неё бронзовое оружие соседствует с железными инструментами, дворцы описаны по образцу тех, что стояли в руинах уже во времена певца, а география после нескольких первых остановок уходит туда, где никакого «на самом деле» не предусмотрено вовсе. Это не ошибки. Это признак жанра: перед нами не хроника, а сказание о времени, которое всегда было раньше.",
   "Дальше эту историю переписывали все, кто до неё дотягивался. Троянского коня подробно описал Вергилий — через семь веков после Гомера. Сциллу из чистого ужаса в заколдованную нимфу превратил Овидий. Сирены стали русалками в Средневековье, хотя у греков были птицами с женскими головами. Ахиллесова пята пришла от римских авторов. Половина «всем известной Одиссеи» написана не Гомером — и каждый слой в своё время был чьей-то вольной адаптацией, которую наверняка ругали ровно теми же словами.",
   "Поэтому вопрос «имеет ли право режиссёр менять первоисточник» задан неточно. Первоисточник и сам — слепок из чужих правок. Точный вопрос другой: что именно он поменял и ради чего.",
   "Грегори Надьэллинист, Гарвард, директор Центра эллинистических исследований",
   "Единственной «изначальной» версии «Одиссеи» не существует. Поэма — не текст одного автора, а осадок столетий устного исполнения: певцы собирали её заново каждый вечер из готовых формул, и каждое исполнение было чуть другим. Тот текст, что мы читаем, — снимок традиции, а не её оригинал.",
   "Спенсер Макдэниелантиковед, автор Tales of Times Forgotten; критик фильма",
   "Разбирая претензии к фильму, отмечает и обратное: сама «Одиссея» не происходит в реальном историческом периоде. Требовать от экранизации археологической точности там, где её нет в источнике, — требование, которое источник не выдержит первым.",
   "Это легко проверить на себе, и проверка приятнее, чем кажется. Десять вещей, которые «все знают про Одиссею». Про каждую один вопрос: это ещё Гомер — или уже кто-то другой?",
   "Считать очки мы не будем. Интереснее посмотреть, кто окажется в списке авторов, когда все десять вопросов кончатся.",
   "Если смотреть внимательно, Нолан взял у Гомера не содержание, а чертёж: возвращение, которое всё откладывается; дом, занятый чужими; человек, который узнаёт своих, но не спешит открыться; и правило гостеприимства как несущая стена всего мира. На этот чертёж он ставит собственную постройку — и она из другого материала.",
   "Потому что свой миф этот режиссёр сочиняет уже двадцать лет, и сюжет у него всегда один. Очень умный человек находит способ обойти правило: устройство памяти, законы сна, чужой секрет, физику времени, устройство материи. Способ срабатывает. И дальше весь оставшийся фильм герой живёт внутри последствий, которые оказались дороже выигрыша. «Помни», «Престиж», «Начало», «Интерстеллар», «Оппенгеймер» — это один и тот же миф, рассказанный пятью способами.",
   "С этой точки зрения «Одиссея» для Нолана — не отклонение и не костюмная экскурсия. Это исходный код его собственной темы, найденный в тексте возрастом три тысячи лет. Троянский конь — идеальный нолановский трюк: гениальный, сработавший и стоивший всего. Оставалось только снять.",
   "Отсюда и вольности с образами. Каждый из них поставлен не ради достоверности, а ради этой мысли: если картинка работает на миф — она остаётся, если только на реконструкцию — её нет. Судить такой подход честнее по результату, чем по верности источнику.",
   "Ещё одна деталь, которую режиссёр подмечает сам: тоска по утраченному лучшему веку встроена в поэму изначально. Гомер, по его словам, «пишет об эпохе на сотни лет раньше, которую его слушатели считали более развитой, чем своя». То есть «Одиссея» — уже ностальгия. Фильм лишь добавляет к ней вторую: нашу собственную, по миру, который казался устойчивым.",
   "Разбор того, что именно Нолан убрал и переписал, включая финал. Это самый спойлерный блок на странице.",
   "Хитрость с «Никто». Почему её убрали и чем заменили — подробно разобрано в главе о Полифеме. Если коротко: в фильме с чудовищами вообще не разговаривают, они не собеседники; вместо знаменитого диалога — бормотание и плач, и это последовательно.",
   "Добавленный герой. В фильме заметную роль играет Синон — и его у Гомера нет вовсе. Это персонаж «Энеиды»: грек, оставшийся под стенами, чтобы уговорить троянцев втащить коня внутрь. У Вергилия он ловкий обманщик, у Нолана — обычный мобилизованный пехотинец, который не хочет умирать и всё-таки идёт. Он работает как двойник главного героя: то, чем тот мог бы быть, если бы не был умнее всех. И платит вместо него.",
   "Боги. Прямого вмешательства свыше в фильме почти нет. Афина присутствует, но так, что до конца неясно, есть ли она на самом деле или это видение человека с искалеченной психикой; Телемах лишь замечает, что у наставника «глаза Афины», — привет тем, кто читал книгу. Сам режиссёр формулирует это прямо: боги реальны, но они внутри людей. Практическое следствие: за всё, что происходит, отвечают исключительно люди.",
   "Спуск к мёртвым. Стоит ровно посередине хронометража, и это не совпадение: чтобы вернуться к себе, герой должен сначала умереть. Самое страшное, что он там видит, — не мучения, а то, что война мёртвых не кончилась. Она идёт дальше, вечно, и насилие не заканчивается вместе с теми, кто его начал.",
   "Финал. У Гомера возвращение — не конец: дальше кровная месть, которую останавливает только божественная амнистия, и пророчество об уходе вглубь суши с веслом. Фильм идёт в другую сторону: его финал отправляет героя и его жену на запад, к морю, отдавать почести мёртвым, — и это рифмуется с их разговором в самом начале. Вместо забвения, которым эпос гасит цикл мести, — память как способ его закрыть.",
   "Разница принципиальная. Гомер предлагает забыть, чтобы остановиться. Нолан предлагает помнить, чтобы остановиться. Второе труднее и, кажется, честнее."
  ]
 },
 {
  "id": "ch11",
  "rom": "XII",
  "title": "Женихи",
  "anchor": "#ch11",
  "paras": [
   "Если считать по времени, женихи занимают в поэме больше места, чем все чудовища вместе взятые. И устроены они как точная противоположность Полифема: тот нарушал протокол со стороны хозяина, эти нарушают его со стороны гостя.",
   "Гостю положено уйти. Гостю положено принять дар и ответить даром. Женихи вместо этого поселились, режут чужой скот, спят со служанками и сватаются к жене хозяина, пока тот не объявлен мёртвым. Формально они ничего не крадут — они «в гостях». В этом и ужас.",
   "И здесь поэма ставит зеркало, от которого неуютно. Женихи делают с домом Одиссея примерно то же, что Одиссей сделал с Троей: входят под видом законных гостей и разоряют изнутри. Резня в двадцать второй песни — это не только справедливость. Это ещё и симметрия.",
   "Гомер отмеряет приближение расправы тремя брошенными предметами. Хозяин ходит по собственному дому в лохмотьях нищего, и в него трижды что-то бросают. Нажмите по очереди.",
   "Третий предмет — тот, ради которого вся триада и построена. Ктесипп произносит вслух формулу дарения: гостю надлежит дать дар. И швыряет коровье копыто. Это ровно та же шутка, что у Полифема со «съем тебя последним», только теперь её отпускают люди, а не чудовище, — и в доме, где хозяин стоит рядом."
  ]
 },
 {
  "id": "ch12",
  "rom": "XIII",
  "title": "Кровать",
  "anchor": "#ch12",
  "paras": [
   "Женихи мертвы, дом отмыт, няня бежит наверх с известием. Пенелопа спускается и садится напротив мужа — молча. Телемах возмущён: почему мать не подойдёт. Она отвечает, что у них есть знаки, известные только им двоим.",
   "Дальше она делает то, чего в поэме не делает больше никто. Она отдаёт распоряжение служанке: вынесите кровать из спальни и постелите ему снаружи.",
   "И он взрывается. Кто сдвинул мою кровать? Столб её вырублен из живой маслины, вросшей в землю; вокруг ствола он выложил стены спальни и сам обтесал дерево, не срубив. Сдвинуть эту кровать нельзя, не убив дерево.",
   "Ловушка сработала. Пенелопа проверяла не память — она проверяла гнев. Подделать можно шрам, рассказ, одежду; нельзя подделать ярость человека, у которого трогают то единственное, что он строил своими руками и что нельзя перенести.",
   "Кровать здесь — не мебель. Это единственный неподвижный предмет в поэме, где двадцать лет всё движется: корабли, острова, ветры, чужие постели. Брак описан как дерево, вросшее в землю. Дом — как то, что построено вокруг дерева.",
   "И это, вероятно, самая обсуждаемая потеря. Рэйчел Лессер пишет, что у Пенелопы отняли её собственное испытание — единственное место, где она умнее мужа. Возражение справедливое.",
   "Энн Хэтэуэй объясняет решение прямо: к этому моменту весь импульс фильма — в вопросе, выживет ли Одиссей, и она всегда думала об этом эпизоде как о розыгрыше. То есть сцена была принесена в жертву темпу финала.",
   "Посмотрите на это через предыдущую главу. Слева Сцилла, справа Харибда: сохранить проверку кроватью — потерять напряжение последних двадцати минут; сохранить темп — потерять единственную сцену, где Пенелопа ведёт. Выбрали второе. Шестеро гребцов остались в скале, и команду об этом не предупредили."
  ]
 },
 {
  "id": "s-end",
  "rom": "XIV",
  "title": "Что нас объединит",
  "anchor": "#s-end",
  "paras": [
   "Если закона Зевса больше нет — что теперь может нас объединить?",
   "Кажется, ради этого вопроса всё и снималось. Древние держались друг за друга страхом перед богом, который мог оказаться нищим у порога. Бога сняли с должности несколько веков назад, а замену так и не назначили: договоры нарушают, право на убежище сворачивают, «чужак не враг» перестало быть очевидным примерно везде.",
   "У фильма нет ответа, и это его лучшее свойство. Но выбор он предлагает — попробуйте выбрать сами.",
   "Правильного ответа у этого разбора нет. Есть предложение: посмотреть фильм ещё раз, зная, что искать. Конь появится трижды и каждый раз будет означать другое. А фраза про то, что предано всё святое между людьми, окажется не сожалением, а диагнозом."
  ]

  return L.divIcon({className:'', html:'<div class="'+cls+'" style="position:relative"><i></i></div>', iconSize:[26,26], iconAnchor:[13,13]});

function initMap(){
  if(!HASL){ document.getElementById('map').innerHTML=
    '<div style="display:grid;place-items:center;height:100%;color:#6d675d;font-size:14px;text-align:center;padding:30px">Карта не загрузилась.<br>Проверьте сеть и перезапустите.</div>'; return; }

  PT.forEach(function(p){
    var m=L.marker([p.lat,p.lon],{icon:pinIcon(p)}).addTo(layerMain);
    m.on('click',function(){ openSheet(p); });
    markers[p.id]=m;
    (p.alt||[]).forEach(function(a){
      var am=L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',html:'<div class="pin alt'+(p.keep===0?' cut':'')+'"><i></i></div>',iconSize:[18,18],iconAnchor:[9,9]})});

var CUR=null;
function openSheet(p,seg){
  CUR=p;
  $('#srole').textContent=p.role; $('#sname').textContent=p.n;
  $('#ssong').textContent=p.song + (p.keep===0?' · в фильме этого нет':(p.keep===2?' · финал фильма':''));
  $('#splace').innerHTML='<b>'+p.place+'</b>. '+p.fact;
  setSeg(seg||'h');
  var v=ST.visited.indexOf(p.id)>=0;
  $('#svisit').textContent = v?'Печать поставлена ✓':'Поставить печать';
  $('#svisit').disabled=v;
  $('#sheet').classList.add('on');
  if(TG&&TG.BackButton){ TG.BackButton.show(); }
  track('point_open',{point:p.id});

  $$('#sseg button').forEach(function(b){b.classList.toggle('on',b.dataset.k===k)});

  '<div class="fact"><b>12 241</b><span>боеголовка в мире · SIPRI 2025 — почему это кино про нас</span></div></div>'+
  '<h3 class="sec">Полные анимации</h3>'+
  '<div class="srow" style="margin-bottom:14px">'+
  '<button class="btn line" data-cine="horse">▶ Дар · 22 сек</button>'+
  '<button class="btn line" data-cine="boom">▶ Взрыв · 28 сек</button></div>'+
  '<a class="btn gold" style="display:block;text-align:center;text-decoration:none" href="'+LAND+'" target="_blank">Полный разбор на сайте →</a>'+
  '<p class="note">Разбор: 24 песни против фильма, протокол гостя по шагам, шесть возражений критиков и ответы на них.</p>';
  $$('#filmwrap [data-cine]').forEach(function(b){ b.addEventListener('click',function(){ openCine(b.dataset.cine); });});
  $('#filmwrap video').addEventListener('play',function(){ track('video_play',{key:'reel-map'}); markAch('viewer1'); },{once:true});
}
/* кино-модалка */
var CINE={horse:{src:'assets/scrub-horse.mp4',caps:[[0,'Туман наползает с воды'],[7.25,'Тлеющие швы — дар дышит изнутри'],[14.5,'Конь гаснет. Загорается город']]},
          boom:{src:'assets/scrub-boom.mp4',caps:[[0,'Башня. Сто метров'],[1.1,'Вспышка'],[4.8,'Огненный шар'],[7.4,'Шар всплывает, стебель растёт'],[12.6,'Тороидальный вихрь'],[20,'Шляпка на тропопаузе']]}};
var cinV=$('#cinV');
function openCine(k){ var c=CINE[k]; $('#cinema').classList.add('on'); cinV.src=c.src; cinV.__caps=c.caps; cinV.__ci=-1;
  $('#cinCap').textContent=c.caps[0][1]; var pr=cinV.play(); if(pr&&pr.catch)pr.catch(function(){});
  track('video_play',{key:k}); ST.seen['v_'+k]=1; save();
  if(ST.seen.v_horse&&ST.seen.v_boom) markAch('viewer'); }
$('#cinX').addEventListener('click',function(){ $('#cinema').classList.remove('on'); cinV.pause(); cinV.removeAttribute('src'); cinV.load(); });
cinV.addEventListener('timeupdate',function(){ var c=cinV.__caps;if(!c)return; var t=cinV.currentTime,i=0;
  for(var k=0;k<c.length;k++) if(t>=c[k][0]) i=k;
  if(i!==cinV.__ci){ cinV.__ci=i; $('#cinCap').textContent=c[i][1]; } });

/* ═══ ачивки ═══ */
var ACH=[
 {id:'first', i:'⚓', n:'Первая печать', d:'посетить первую остановку'},
 {id:'circle',i:'🧭', n:'Полный круг', d:'все 16 остановок'},
 {id:'xenia', i:'🤝', n:'Ксения', d:'прочитать главы о законе и протоколе'},
 {id:'sage',  i:'📜', n:'Аэд', d:'прочитать все 14 глав'},
 {id:'nav5',  i:'🔬', n:'Скептик', d:'включить слой версий учёных'},
 {id:'viewer1',i:'🗺', n:'Штурман', d:'посмотреть ролик-маршрут'},
 {id:'viewer',i:'🎬', n:'Зритель', d:'обе полные анимации'},
];
function markAch(id){ if(ST.ach.indexOf(id)>=0)return; ST.ach.push(id); save();
  var a=ACH.filter(function(x){return x.id===id})[0];
  if(a){ toast(a.i+' '+a.n); track('ach_unlock',{ach:id}); }
  refreshMe(); }
function refreshMe(){
  var total=16+14+ACH.length;
  var done=ST.visited.length+ST.read.length+ST.ach.length;
  $('#mewrap').innerHTML='<h3 class="sec">Печати</h3>'+
  '<div id="pbar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>'+
  '<p class="note" style="margin-top:2px">'+ST.visited.length+'/16 остановок · '+ST.read.length+'/14 глав</p>'+
  '<div class="achgrid">'+ACH.map(function(a){
    return '<div class="ach'+(ST.ach.indexOf(a.id)>=0?' got':'')+'"><div><i>'+a.i+'</i><span>'+a.n+'</span></div></div>';
  }).join('')+'</div>'+
  '<h3 class="sec">Маршрут</h3><div class="achgrid">'+PT.map(function(p){
    var v=ST.visited.indexOf(p.id)>=0;
    return '<div class="ach'+(v?' got':'')+'"><div><i>'+(v?'✓':'·')+'</i><span>'+p.n+'</span></div></div>';
  }).join('')+'</div>'+
  '<p class="note">Прогресс хранится у вас: в Телеграме — в облаке аккаунта, в браузере — на устройстве. Мы не собираем имён и контактов; аналитика — только безличные события.</p>'+
  '<button class="btn line" style="margin-top:10px" id="reset">Сбросить прогресс</button>';
  var r=$('#reset'); if(r) r.addEventListener('click',function(){
    if(confirm('Стереть все печати?')){ ST={visited:[],ach:[],read:[],seen:{}}; save(); refreshAll(); }});
}
function toast(t){ $('#toastN').textContent=t; $('#toast').classList.add('on');
  clearTimeout(toast.__t); toast.__t=setTimeout(function(){$('#toast').classList.remove('on')},2600); }

/* ═══ онбординг ═══ */
function onboarding(){
  if(lsGet('zz-onb'))return;
  var steps=[
   {i:'🗺',h:'Это путеводитель',p:'По «Одиссее» — поэме, фильму Нолана и настоящей карте. Никакого порядка: тыкайте куда интересно.'},
   {i:'⚖',h:'Три версии каждого места',p:'У каждой остановки три вкладки: что написал Гомер, что сделал Нолан и куда это место помещает наука — Северин, Веснин, археологи.'},
   {i:'⚓',h:'Собирайте печати',p:'Отмечайте пройденные остановки и прочитанные главы. Прогресс сохранится — в Телеграме он привязан к аккаунту.'}];
  var k=0, el=$('#onb');
  function draw(){ var s=steps[k];
    el.innerHTML='<div class="step on"><div class="ico">'+s.i+'</div><h1>'+(k===0?'Закон <em>Зевса</em>':s.h)+'</h1>'+
    (k===0?'<p style="color:var(--bronze);font-size:13px;letter-spacing:.1em">ПУТЕВОДИТЕЛЬ ПО «ОДИССЕЕ»</p>':'')+
    '<p>'+s.p+'</p><button class="btn gold">'+(k<2?'Дальше':'В путь')+'</button>'+
    '<div class="dots">'+steps.map(function(_,j){return '<i class="'+(j===k?'on':'')+'"></i>'}).join('')+'</div></div>';
    $('.btn',el).addEventListener('click',function(){ k++; if(k>=3){ el.classList.remove('on'); lsSet('zz-onb','1'); track('onboarding_done'); } else draw(); });
  }
  el.classList.add('on'); draw(); track('onboarding_start');
}

function refreshAll(){ buildChapters(); refreshMe(); if(HASL) PT.forEach(function(p){ if(markers[p.id]) markers[p.id].setIcon(pinIcon(p)); }); }

/* ═══ старт ═══ */
initMap(); buildChapters(); buildFilm(); refreshMe(); onboarding();
})();
</script>
</body></html>
